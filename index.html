<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gym Essentials</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;

    }


    body {

      background: #050505;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      padding: 25px;

    }


    /* =========================
       CONTENEDOR PRINCIPAL
    ========================= */

    .pagina {

      width: 100%;

      max-width: 900px;

      text-align: center;

    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      width: 150px;

      height: 150px;

      object-fit: contain;

      display: block;

      margin: 0 auto 20px auto;

    }


    /* =========================
       MARCA
    ========================= */

    .marca {

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 5px;

      margin-bottom: 8px;

    }


    .submarca {

      font-size: 12px;

      letter-spacing: 3px;

      color: #999;

      margin-bottom: 45px;

    }


    /* =========================
       OPCIONES
    ========================= */

    .opciones {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 20px;

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

    }


    .opcion {

      background: #111;

      border: 1px solid #2b2b2b;

      border-radius: 12px;

      padding: 35px 25px;

      text-decoration: none;

      color: white;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;

    }


    .opcion:hover {

      transform: translateY(-3px);

      border-color: #555;

      background: #161616;

    }


    .icono {

      font-size: 42px;

      margin-bottom: 18px;

    }


    .titulo {

      font-size: 21px;

      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 10px;

    }


    .descripcion {

      color: #999;

      font-size: 12px;

      line-height: 1.5;

      min-height: 36px;

    }


    .boton {

      display: inline-block;

      margin-top: 22px;

      padding: 11px 24px;

      border: 1px solid white;

      border-radius: 5px;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 1px;

    }


    /* =========================
       REDES SOCIALES
    ========================= */

    .redes {

      margin-top: 45px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 22px;

    }


    .red-social {

      width: 34px;

      height: 34px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: white;

      text-decoration: none;

      opacity: 0.85;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

    }


    .red-social:hover {

      opacity: 1;

      transform: translateY(-2px);

    }


    .red-social svg {

      width: 22px;

      height: 22px;

      fill: currentColor;

    }


    /* =========================
       PIE
    ========================= */

    .pie {

      margin-top: 25px;

      color: #555;

      font-size: 10px;

      letter-spacing: 1px;

    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 650px) {

      body {

        padding: 20px 15px;

      }


      .logo {

        width: 125px;

        height: 125px;

        margin-bottom: 15px;

      }


      .marca {

        font-size: 23px;

        letter-spacing: 4px;

      }


      .submarca {

        font-size: 10px;

        letter-spacing: 2px;

        margin-bottom: 32px;

      }


      .opciones {

        grid-template-columns: 1fr;

        gap: 14px;

      }


      .opcion {

        padding: 25px 20px;

      }


      .icono {

        font-size: 35px;

        margin-bottom: 12px;

      }


      .titulo {

        font-size: 18px;

      }


      .descripcion {

        font-size: 11px;

      }


      .redes {

        margin-top: 32px;

      }

    }

  </style>

</head>


<body>


  <main class="pagina">


    <!-- =========================
         LOGO
    ========================== -->

    <img

      <!-- FACEBOOK -->

        <svg

    </div>


    <div class="pie">

      MEXICALI · MÉXICO

    </div>


  </main>


</body>

</html>
